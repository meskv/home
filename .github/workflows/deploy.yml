name: Deploy Static Index Site

# 1. Triggers: Run this workflow when a push or pull request occurs on the 'web' branch.
on:
  push:
    branches:
      - web
  pull_request:
    branches:
      - web

# Allows GitHub Actions to get deployment status updates
permissions:
  contents: read
  pages: write
  id-token: write

# 2. Deployment Job
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        # Action to check out the 'web' branch code
        uses: actions/checkout@v4

      - name: Setup Pages
        # Action to configure the GitHub Pages environment
        uses: actions/configure-pages@v5

      - name: Upload artifact
        # The 'artifact' is the folder containing your static site files.
        # Since 'index.html' is in the root, we upload the root directory ('.').
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        # Action to finalize the deployment
        uses: actions/deploy-pages@v4